<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings Timeline Viewer</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="center-panel">
        <div class="container">
            <header>
                <h1>🏠 Buildings Timeline View</h1>
                <h3></h3>
                
                
                
                <div class="file-input-section">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv" />
                        
                    </div>
                    <div id="status"></div>
                </div>
                
                
                <div id="legend"></div>
            </header>
            
            <div id="timelineContainer"></div>
        </div>
    </div>

    
    <div id="tooltip"></div>

    <!-- Resident Details Modal -->
    <div id="residentModalOverlay" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.35); z-index:10000; justify-content:center; align-items:center;">
      <div id="residentModal" style="background:#fff; border-radius:10px; max-width:480px; width:90vw; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.25); padding:2rem; position:relative;">
        <button id="closeResidentModal" style="position:absolute; top:10px; right:16px; background:none; border:none; font-size:1.5rem; cursor:pointer; color:#888;">&times;</button>
        <div id="residentModalContent"></div>
      </div>
    </div>

    <!-- Load JavaScript modules in dependency order -->
    <script src="tooltip.js"></script>
    <script src="colorUtils.js"></script>
    <!-- <script src="csvParser.js"></script> --->
    <script src="timelineRenderer.js"></script>
    <script src="main.js"></script>
</body>
</html>
