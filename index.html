<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buildings Timeline Viewer</title>
	<link rel="stylesheet" href="styles.css">
    <!-- Materialize CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
</head>
<body>
    <div class="center-panel">
        <div class="container">
            <header>
                <h3 class="center-align">🏠 Buildings Timeline View</h3>
                <h3></h3>
                
                
                
                <div class="file-input-section">
                    <div class="file-input-wrapper">
                        <input type="file" id="fileInput" accept=".csv" />
                        
                    </div>
                    <div id="status"></div>
                </div>
                
                
                <div id="legend"></div>
            </header>
            
            <div id="timelineContainer"></div>
        </div>
    </div>

    
    <div id="tooltip"></div>

    <!-- Resident Details Modal (Materialize) as direct child of body -->
    <div id="residentModal" class="modal">
      <div class="modal-content">
        <h5 id="residentModalTitle"></h5>
        <div id="residentModalContent"></div>
      </div>
      <div class="modal-footer">
        <a href="#!" class="modal-close waves-effect waves-green btn-flat">Close</a>
      </div>
    </div>

    <!-- Load JavaScript modules in dependency order -->
    <script src="tooltip.js"></script>
    <script src="colorUtils.js"></script>
    <!-- <script src="csvParser.js"></script> --->
    <script src="timelineRenderer.js"></script>
    <script src="main.js"></script>
    <!-- Materialize JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
</body>
</html>
